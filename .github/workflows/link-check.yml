name: Source link check

# Fee pages move and disappear. This checks every source link in the dataset weekly and
# opens an issue listing the dead ones, so the data does not quietly rot.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check links
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          args: >-
            --no-progress --max-retries 2 --timeout 30
            --accept 200,204,206,301,302,403,429
            public/js/data.js README.md docs
      - name: Open an issue if links are broken
        if: steps.lychee.outputs.exit_code != 0
        uses: peter-evans/create-issue-from-file@v5
        with:
          title: "Source links need review"
          content-filepath: ./lychee/out.md
          labels: data, automated
